name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the "Not supported (yet)" section of the README first — some things are deliberately out of scope (FTP, cloud storage backends, plugin systems).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
